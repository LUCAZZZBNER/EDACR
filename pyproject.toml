[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edabench"
version = "0.1.0"
description = "Resumable EDA pull-request review corpus collection"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "openpyxl>=3.1", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["edabench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
